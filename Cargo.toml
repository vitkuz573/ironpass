[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/subscription",
    "crates/hwid",
    "crates/config",
    "crates/transport",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["IronPass Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env", "unicode"] }
clap_complete = "4"
indicatif = "0.17"
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# Error handling
anyhow = "1"
thiserror = "2"
color-eyre = "0.6"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"

# Crypto & HWID
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
machine-uid = "0.5"
gethostname = "0.4"
rand = "0.8"
base64 = "0.22"
hex = "0.4"

# URL parsing
url = "2"

# Config directories
dirs = "6"
directories = "6"

# Regex
regex = "1"

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }

# Async traits
async-trait = "0.1"

# Misc
derive_more = { version = "2", features = ["display", "from_str"] }
strum = { version = "0.27", features = ["derive"] }
itertools = "0.14"
humantime = "2"
bytesize = "1"
hostname = "0.4"

# Proxy engine
rustls = { version = "0.23", features = ["ring", "std"] }
rustls-pemfile = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
h2 = "0.4"
tungstenite = { version = "0.26", features = ["native-tls"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
prost = "0.13"
tonic = "0.12"
trust-dns-resolver = "0.23"
socket2 = "0.5"
pnet = "0.35"
tun = { version = "0.7", features = ["tokio"] }
etherparse = "0.16"
dashmap = "6"

# Internal crates
ironpass-core = { path = "crates/core" }
ironpass-subscription = { path = "crates/subscription" }
ironpass-hwid = { path = "crates/hwid" }
ironpass-config = { path = "crates/config" }
ironpass-transport = { path = "crates/transport" }
ironpass-engine = { path = "crates/engine" }
